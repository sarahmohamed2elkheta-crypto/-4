<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أبطال الأسبوع - لمس. دنيا سالم</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: linear-gradient(160deg, #fffdf7 0%, #f4f7ff 100%);
  color: #1a1a1a;
  min-height: 100vh;
  padding: 24px 16px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; }
.hero { text-align: center; padding: 16px 0 8px; }
.kicker { font-size: 13px; color: #8a6d1a; margin-bottom: 6px; font-weight: 600; }
h1 {
  font-size: 34px; margin: 0 0 6px; font-weight: 700; color: #14213d;
  letter-spacing: 0;
}
.who { font-size: 16px; color: #444; margin: 0 0 14px; }
.who b { color: #14213d; }
.pride {
  font-size: 16px; line-height: 1.7; color: #555; text-align: center;
  max-width: 480px; margin: 0 auto 20px;
}
.card {
  background: #ffffff; border: 1px solid #ece6d4; border-radius: 16px;
  padding: 20px; margin-bottom: 16px;
  box-shadow: 0 4px 18px rgba(20, 33, 61, .06);
}
.sec { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.sec h2 { font-size: 18px; margin: 0; color: #14213d; font-weight: 700; }
.count {
  font-size: 12px; color: #8a6d1a; background: #fdf3d7;
  border: 1px solid #ecd9a0; border-radius: 20px; padding: 2px 12px; font-weight: 600;
}
.grid { display: flex; flex-wrap: wrap; gap: 10px; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  border-radius: 10px; padding: 9px 14px; font-size: 15px; font-weight: 600;
  background: #fdf6e3; border: 1px solid #ecd9a0; color: #6b5310;
  opacity: 0; animation: pop .4s ease forwards;
}
.badge.blue { background: #eef4ff; border-color: #c7d8f7; color: #1d4e9e; }
.badge svg { flex: none; }
.star-gold { color: #e8a800; }
.star-blue { color: #3b74d1; }
.cta { display: flex; justify-content: center; margin: 8px 0 4px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: none; background: #14213d; color: #fff;
  border-radius: 12px; padding: 12px 26px; font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: background .2s ease, transform .15s ease;
}
.btn:hover { background: #1d3261; transform: translateY(-1px); }
.btn.ghost { background: transparent; color: #14213d; border: 1px solid #d5d5d5; padding: 8px 16px; font-size: 14px; }
.btn.ghost:hover { background: #f2f2f2; transform: none; }
.view { display: none; }
.view.on { display: block; }
.footer { text-align: center; font-size: 13px; color: #999; margin-top: 20px; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.95); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="view on" id="v1">
    <div class="hero">
      <div class="kicker">تكريم أسبوعي 🏅</div>
      <h1>أبطال الأسبوع</h1>
      <p class="who">لمس. <b>دنيا سالم</b> 💙</p>
    </div>
    <p class="pride">حقيقي فخورة بيكم يا أبطال المنصة، وربنا يوفقكم دايماً وأشوفكم أشطر الشطار 🥰👏💙</p>

    <div class="card">
      <div class="sec">
        <h2>قائمة أبطال الأسبوع في كل المواد</h2>
        <span class="count">15 بطل</span>
      </div>
      <div class="grid" id="g1"></div>
    </div>

    <div class="cta">
      <button class="btn" id="toV2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4a1 1 0 0 0-1 1c0 2.5 1.5 4 4 4M17 6h3a1 1 0 0 1 1 1c0 2.5-1.5 4-4 4"/></svg>
        أبطال الأسبوع في المواد الفردية
      </button>
    </div>
  </div>

  <div class="view" id="v2">
    <div class="card" style="margin-top:16px;">
      <div class="sec">
        <button class="btn ghost" id="back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          رجوع
        </button>
        <h2>أبطال الأسبوع في المواد الفردية</h2>
        <span class="count">21 بطل</span>
      </div>
      <div class="grid" id="g2"></div>
    </div>
  </div>

  <div class="footer">أبطال الأسبوع — لمس. دنيا سالم 🌟</div>
</div>

<script>
var starGold = '<svg class="star-gold" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.6l2.5 5.1 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8L12 3.6Z"/></svg>';
var starBlue = '<svg class="star-blue" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.6l2.5 5.1 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8L12 3.6Z"/></svg>';
var all = ['آلاء عاطف','زياد عاشور','إياد محمد سلامة','إسراء كليب','محمد العبيدي','سيف هشام','محمد عماد','مسلم رجب','ريماس سامي','عمر ربيع','مالك أحمد','مارتينا أشرف','يوسف علي أنور','محمد شريف','آدم عبد الفتاح'];
var subj = ['حبيبة محمود','عبد الرحمن صابر','عمار أسامة','ليان عبد المتعال','أحمد عادل','عمر ربيع','عائشة أسامة','مريم الإمام','ميراي مخلص','وعد وليد','فريدة علاء','مرام بدوي','ريم تامر','إياد ماهر','أسماء نشأت','إيمي عماد','رودينا خالد','رانيا ناروز','ندى حمدي','إيمان غنيم','وفاء محمد'];
function render(id, names){
  document.getElementById(id).innerHTML = names.map(function(n,i){
    var blue = i % 2 === 1;
    return '<span class="badge'+(blue?' blue':'')+'" style="animation-delay:'+(i*60)+'ms">'+(blue?starBlue:starGold)+'<span>'+n+'</span></span>';
  }).join('');
}
render('g1', all);
render('g2', subj);
document.getElementById('toV2').onclick = function(){ document.getElementById('v1').classList.remove('on'); document.getElementById('v2').classList.add('on'); window.scrollTo({top:0, behavior:'smooth'}); };
document.getElementById('back').onclick = function(){ document.getElementById('v2').classList.remove('on'); document.getElementById('v1').classList.add('on'); window.scrollTo({top:0, behavior:'smooth'}); };
</script>
</body>
</html>
